<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Staff</title>
  <link rel="icon" href="assets/favicon.svg?v=5" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=5">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="section">
    <div class="container">
      <div id="config-warning"></div>

      <!-- Sign in -->
      <div id="login-view" class="hidden" style="max-width:420px;margin:0 auto">
        <h1>Staff sign-in</h1>
        <form id="login-form" class="card">
          <div id="login-error"></div>
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" autocomplete="current-password" required>
          </div>
          <button id="login-btn" class="btn btn-primary" type="submit" style="width:100%">Sign in</button>
        </form>
      </div>

      <!-- Signed in but not on the staff list -->
      <div id="denied-view" class="hidden" style="max-width:520px;margin:0 auto">
        <div class="notice notice-error">This account isn't on the staff list. Ask an administrator to add it to the <code>staff</code> table.</div>
        <button class="btn btn-secondary signout">Sign out</button>
      </div>

      <!-- Ticket queue -->
      <div id="app-view" class="hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">
          <h1 style="margin:0">Ticket queue</h1>
          <div style="display:flex;gap:8px;align-items:center">
            <span id="whoami" class="muted small"></span>
            <button id="refresh-btn" class="btn btn-secondary btn-sm">Refresh</button>
            <button class="btn btn-secondary btn-sm signout">Sign out</button>
          </div>
        </div>
        <div id="stats" class="stats"></div>

        <div class="admin-layout">
          <div>
            <div class="toolbar">
              <input id="f-search" type="search" placeholder="Search ref, name, email, subject">
              <select id="f-status">
                <option value="active">Active (not resolved)</option>
                <option value="all">All statuses</option>
              </select>
              <select id="f-category"><option value="all">All categories</option></select>
              <select id="f-assigned">
                <option value="all">Anyone</option>
                <option value="me">Assigned to me</option>
                <option value="none">Unassigned</option>
              </select>
            </div>
            <ul id="ticket-list" class="ticket-list"></ul>
          </div>
          <div id="detail" class="card"><p class="muted">Select a ticket to view it.</p></div>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/config.js?v=5"></script>
  <script src="assets/faq.js?v=5"></script>
  <script src="assets/app.js?v=5"></script>
  <script>
    renderChrome("");
    STATUS_LABELS.waiting_on_customer = "Waiting on customer";  // staff wording
    const $ =(id) => document.getElementById(id);
    const views = ["login-view", "denied-view", "app-view"];
    const show = (id) => views.forEach((v) => $(v).classList.toggle("hidden", v !== id));
    const PRIORITY_ORDER = { urgent: 0, high: 1, normal: 2, low: 3 };

    let me = null;          // { user_id, display_name }
    let staff = [];         // all staff rows
    let tickets = [];
    let selectedId = null;

    // Filters
    for (const [value, label] of Object.entries(STATUS_LABELS)) $("f-status").add(new Option(label, value));
    for (const c of CFG.categories) $("f-category").add(new Option(c.name, c.id));
    ["f-search", "f-status", "f-category", "f-assigned"].forEach((id) => $(id).addEventListener("input", renderList));

    function staffName(id) {
      const s = staff.find((s) => s.user_id === id);
      return s ? s.display_name : "Unknown";
    }

    // ------------------------------------------------------------------ auth
    async function start() {
      if (!isConfigured()) {
        $("config-warning").innerHTML = notConfiguredHtml();
        return;
      }
      const { data: { session } } = await getDb().auth.getSession();
      if (session) await enter(session.user); else show("login-view");
    }

    async function enter(user) {
      const { data: ok, error } = await getDb().rpc("is_staff");
      if (error || !ok) return show("denied-view");
      const { data: staffRows } = await getDb().from("staff").select("user_id, display_name").order("display_name");
      staff = staffRows || [];
      me = staff.find((s) => s.user_id === user.id) || { user_id: user.id, display_name: user.email };
      $("whoami").textContent = `Signed in as ${me.display_name}`;
      show("app-view");
      await loadTickets();
    }

    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("login-error").innerHTML = "";
      const btn = $("login-btn");
      btn.disabled = true;
      const { data, error } = await getDb().auth.signInWithPassword({
        email: $("login-email").value.trim(),
        password: $("login-password").value,
      });
      btn.disabled = false;
      if (error) {
        $("login-error").innerHTML = `<div class="notice notice-error">${esc(errorMessage(error))}</div>`;
        return;
      }
      $("login-password").value = "";
      await enter(data.user);
    });

    document.querySelectorAll(".signout").forEach((b) => b.addEventListener("click", async () => {
      await getDb().auth.signOut();
      me = null; tickets = []; selectedId = null;
      $("detail").innerHTML = `<p class="muted">Select a ticket to view it.</p>`;
      show("login-view");
    }));

    // --------------------------------------------------------------- queue
    async function loadTickets() {
      const { data, error } = await getDb()
        .from("tickets")
        .select("id, ref, name, email, subject, status, priority, category, assigned_to, created_at, updated_at")
        .order("updated_at", { ascending: false })
        .limit(1000);
      if (error) {
        $("ticket-list").innerHTML = `<li class="notice-error">${esc(errorMessage(error))}</li>`;
        return;
      }
      tickets = data;
      renderStats();
      renderList();
    }

    function renderStats() {
      const counts = Object.fromEntries(Object.keys(STATUS_LABELS).map((s) => [s, 0]));
      tickets.forEach((t) => counts[t.status]++);
      const unassigned = tickets.filter((t) => !t.assigned_to && !["resolved", "closed"].includes(t.status)).length;
      $("stats").innerHTML =
        Object.entries(counts).map(([s, n]) => `<div class="stat"><strong>${n}</strong>${esc(STATUS_LABELS[s])}</div>`).join("") +
        `<div class="stat"><strong>${unassigned}</strong>Unassigned (active)</div>`;
    }

    function filteredTickets() {
      const q = $("f-search").value.trim().toLowerCase();
      const status = $("f-status").value;
      const cat = $("f-category").value;
      const assigned = $("f-assigned").value;
      return tickets
        .filter((t) => status === "all" || (status === "active" ? !["resolved", "closed"].includes(t.status) : t.status === status))
        .filter((t) => cat === "all" || t.category === cat)
        .filter((t) => assigned === "all" || (assigned === "me" ? t.assigned_to === me.user_id : !t.assigned_to))
        .filter((t) => !q || [t.ref, t.name, t.email, t.subject].some((v) => (v || "").toLowerCase().includes(q)))
        .sort((a, b) => PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority] || b.updated_at.localeCompare(a.updated_at));
    }

    function renderList() {
      const list = filteredTickets();
      $("ticket-list").innerHTML = list.length
        ? list.map((t) => `
          <li data-id="${t.id}" class="${t.id === selectedId ? "active" : ""}">
            <div class="tl-top"><span>${esc(t.ref)} · <span class="prio-${esc(t.priority)}">${esc(PRIORITY_LABELS[t.priority])}</span></span>${statusBadge(t.status)}</div>
            <div class="tl-subject">${esc(t.subject)}</div>
            <div class="tl-top"><span>${esc(t.name)} · ${esc(categoryName(t.category))}</span><span>${esc(fmtDate(t.updated_at))}</span></div>
          </li>`).join("")
        : `<li class="muted" style="cursor:default">No tickets match.</li>`;
    }

    $("ticket-list").addEventListener("click", (e) => {
      const li = e.target.closest("li[data-id]");
      if (li) openTicket(Number(li.dataset.id));
    });
    $("refresh-btn").addEventListener("click", async () => {
      await loadTickets();
      if (selectedId) openTicket(selectedId);
    });

    // -------------------------------------------------------------- detail
    async function openTicket(id) {
      selectedId = id;
      renderList();
      const db = getDb();
      const [{ data: t, error }, { data: msgs }] = await Promise.all([
        db.from("tickets").select("*").eq("id", id).single(),
        db.from("ticket_messages").select("*").eq("ticket_id", id).order("created_at"),
      ]);
      if (error) {
        $("detail").innerHTML = `<div class="notice notice-error">${esc(errorMessage(error))}</div>`;
        return;
      }
      const thread = [{ author_type: "customer", author_name: t.name, body: t.description, created_at: t.created_at }, ...(msgs || [])];
      $("detail").innerHTML = `
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <span class="ticket-ref" style="font-size:1rem">${esc(t.ref)}</span>${statusBadge(t.status)}
        </div>
        <h2 style="margin-top:6px">${esc(t.subject)}</h2>
        <div class="meta">
          <span><strong>${esc(t.name)}</strong></span>
          ${t.email ? `<a href="mailto:${esc(t.email)}?subject=${encodeURIComponent(`[${t.ref}] ${t.subject}`)}">${esc(t.email)}</a>` : `<span>No email given</span>`}
          ${t.phone ? `<a href="tel:${esc(t.phone)}">${esc(t.phone)}</a>` : ""}
          <span>${esc(categoryName(t.category))}</span>
          ${t.reference_number ? `<span>Ref: ${esc(t.reference_number)}</span>` : ""}
          <span>Opened ${esc(fmtDate(t.created_at))}</span>
        </div>
        <div class="detail-controls">
          <label class="small">Status <select id="d-status">${Object.entries(STATUS_LABELS)
            .map(([v, l]) => `<option value="${v}"${v === t.status ? " selected" : ""}>${l}</option>`).join("")}</select></label>
          <label class="small">Priority <select id="d-priority">${Object.entries(PRIORITY_LABELS)
            .map(([v, l]) => `<option value="${v}"${v === t.priority ? " selected" : ""}>${l}</option>`).join("")}</select></label>
          <label class="small">Assigned <select id="d-assigned"><option value="">Unassigned</option>${staff
            .map((s) => `<option value="${esc(s.user_id)}"${s.user_id === t.assigned_to ? " selected" : ""}>${esc(s.display_name)}</option>`).join("")}</select></label>
        </div>
        <div class="thread">${thread.map((m) => `
          <div class="msg ${m.is_internal ? "msg-internal" : m.author_type === "staff" ? "msg-staff" : ""}">
            <div class="msg-head"><strong>${esc(m.author_name || (m.author_type === "staff" ? "Support" : "Customer"))}${m.is_internal ? " · internal note" : ""}</strong>
              <span>${esc(fmtDate(m.created_at))}</span></div>
            <div class="msg-body">${esc(m.body)}</div>
          </div>`).join("")}
        </div>
        <form id="reply-form">
          <div id="reply-error"></div>
          <div class="field">
            <label for="reply-body">Reply</label>
            <textarea id="reply-body" maxlength="10000" required></textarea>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
            <label class="checkbox small"><input type="checkbox" id="reply-internal"> Internal note (customer can't see it)</label>
            <div style="display:flex;gap:8px;align-items:center">
              <label class="small">then set status
                <select id="reply-status">
                  <option value="">(no change)</option>
                  <option value="waiting_on_customer" selected>Waiting on customer</option>
                  <option value="in_progress">In progress</option>
                  <option value="resolved">Resolved</option>
                </select>
              </label>
              <button id="reply-btn" class="btn btn-primary" type="submit">Send</button>
            </div>
          </div>
          <p class="muted small">Customers see replies when they check their ticket status. Email them from the link above if it's time-sensitive.</p>
        </form>`;

      const update = async (fields) => {
        const { error } = await db.from("tickets").update(fields).eq("id", id);
        if (error) alert(errorMessage(error));
        await loadTickets();
        openTicket(id);
      };
      $("d-status").addEventListener("change", (e) => update({ status: e.target.value }));
      $("d-priority").addEventListener("change", (e) => update({ priority: e.target.value }));
      $("d-assigned").addEventListener("change", (e) => update({ assigned_to: e.target.value || null }));
      $("reply-internal").addEventListener("change", (e) => { if (e.target.checked) $("reply-status").value = ""; });

      $("reply-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const body = $("reply-body").value.trim();
        if (!body) return;
        $("reply-btn").disabled = true;
        const { error } = await db.from("ticket_messages").insert({
          ticket_id: id,
          author_type: "staff",
          author_name: me.display_name,
          body,
          is_internal: $("reply-internal").checked,
        });
        if (error) {
          $("reply-error").innerHTML = `<div class="notice notice-error">${esc(errorMessage(error))}</div>`;
          $("reply-btn").disabled = false;
          return;
        }
        const fields = {};
        if ($("reply-status").value) fields.status = $("reply-status").value;
        if (!t.assigned_to) fields.assigned_to = me.user_id;  // whoever answers first takes the ticket
        await update(Object.keys(fields).length ? fields : { updated_at: new Date().toISOString() });
      });
    }

    // Keep the queue fresh while the page is open.
    setInterval(() => { if (me && document.visibilityState === "visible") loadTickets(); }, 60000);

    start();
  </script>
</body>
</html>
