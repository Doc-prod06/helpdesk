<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="assets/style.css?v=3">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main>
    <section class="hero">
      <div class="container narrow">
        <h1>How can we help?</h1>
        <p>Search our help articles, or send us a request and we'll get back to you.</p>
        <div class="search-box">
          <input id="search" type="search" placeholder="Search for answers, e.g. &quot;reset password&quot;" aria-label="Search help articles">
          <div id="search-results" class="search-results"></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <h2>What do you need help with?</h2>
        <p class="muted">Pick a topic to open a ticket.</p>
        <div id="categories" class="grid"></div>
      </div>
    </section>

    <section class="section" id="faq">
      <div class="container narrow">
        <h2>Help articles</h2>
        <div id="faq-filters" class="faq-filters"></div>
        <div id="faq-list"></div>
      </div>
    </section>

    <section class="section" id="contact">
      <div class="container">
        <h2>Contact us</h2>
        <div class="two-col">
          <div class="card">
            <h3>Get in touch</h3>
            <ul id="contact-list" class="contact-list"></ul>
            <a class="btn btn-primary" href="submit.html">Submit a ticket</a>
            <a class="btn btn-secondary" href="status.html">Check ticket status</a>
          </div>
          <div class="card">
            <h3 style="display:flex;justify-content:space-between;align-items:center">Support hours <span id="open-badge"></span></h3>
            <div id="hours"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="assets/config.js?v=3"></script>
  <script src="assets/faq.js?v=3"></script>
  <script src="assets/app.js?v=3"></script>
  <script>
    renderChrome("home");

    document.getElementById("categories").innerHTML = CFG.categories
      .map((c) => `<a class="card cat-card" href="submit.html?category=${encodeURIComponent(c.id)}">
        <span class="cat-icon" aria-hidden="true">${c.icon}</span>
        <h3>${esc(c.name)}</h3><p>${esc(c.description)}</p></a>`)
      .join("");

    // Hero search
    const searchInput = document.getElementById("search");
    const searchResults = document.getElementById("search-results");
    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim();
      if (!q) { searchResults.innerHTML = ""; return; }
      const hits = searchFaq(q, 5);
      searchResults.innerHTML = hits.length
        ? hits.map(faqItemHtml).join("")
        : `<div class="card">No articles match “${esc(q)}”. <a href="submit.html">Submit a ticket</a> and we'll help.</div>`;
    });

    // FAQ list with category filter (only categories that have articles)
    let activeCat = "all";
    const usedCats = CFG.categories.filter((c) => HELPDESK_FAQ.some((f) => f.category === c.id));
    const filters = document.getElementById("faq-filters");
    function renderFaq() {
      filters.innerHTML = [{ id: "all", name: "All" }, ...usedCats]
        .map((c) => `<button class="chip" data-cat="${esc(c.id)}" aria-pressed="${c.id === activeCat}">${esc(c.name)}</button>`)
        .join("");
      document.getElementById("faq-list").innerHTML = HELPDESK_FAQ
        .filter((f) => activeCat === "all" || f.category === activeCat)
        .map(faqItemHtml)
        .join("");
    }
    filters.addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (btn) { activeCat = btn.dataset.cat; renderFaq(); }
    });
    renderFaq();

    // Contact and hours
    document.getElementById("contact-list").innerHTML = `
      <li>✉️ <a href="mailto:${esc(CFG.contact.email)}">${esc(CFG.contact.email)}</a></li>
      <li>📞 <a href="tel:${esc(CFG.contact.phone.replace(/[^\d+]/g, ""))}">${esc(CFG.contact.phone)}</a></li>
      <li class="muted">${esc(CFG.contact.responseTime)}</li>`;
    document.getElementById("hours").innerHTML = hoursTableHtml();
    document.getElementById("open-badge").innerHTML = openBadgeHtml();
  </script>
</body>
</html>
